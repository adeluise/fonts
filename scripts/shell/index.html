<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #171717;
    --ink-hover: #262626;
    --muted: #737373;
    --label: #A3A3A3;
    --line: #E5E5E5;
    --fill: #F5F5F5;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 14px 36px rgba(0,0,0,.13);
    --ui: "DM Sans", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fff; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  #dock {
    position: fixed; left: 0; right: 0; bottom: 40px;
    display: flex; justify-content: center; pointer-events: none;
  }
  #bar {
    pointer-events: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 10px;
    border-radius: 16px; background: #fff; border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-family: var(--ui);
  }
  .rule { width: 1px; height: 24px; flex-shrink: 0; background: var(--line); }
  .history { display: flex; align-items: center; gap: 2px; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex-shrink: 0;
    border: 0; border-radius: var(--radius); background: transparent;
    color: var(--ink); cursor: pointer; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { background: var(--fill); }
  .icon-btn:disabled { color: #D4D4D4; cursor: default; }

  .selects { display: flex; align-items: center; gap: 4px; }
  .select {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px 7px; border: 0; border-radius: var(--radius);
    background: transparent; cursor: pointer; text-align: left;
    font-family: var(--ui);
  }
  .select:hover, .select[aria-expanded="true"] { background: var(--fill); }
  .select[data-role="header"], .select[data-role="text"] { width: 183px; }
  .select[data-role="mono"] { width: 168px; }
  .select .col { display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0; }
  .select .label {
    font-size: 10px; font-weight: 600; color: var(--label);
    letter-spacing: .1em; text-transform: uppercase; line-height: 12px;
  }
  .select .value {
    font-size: 14px; font-weight: 500; color: var(--ink);
    letter-spacing: -.012em; line-height: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .select .caret { flex-shrink: 0; color: var(--muted); }

  #apply {
    display: flex; align-items: center; justify-content: center;
    width: 137px; height: 40px; flex-shrink: 0;
    border: 0; border-radius: var(--radius); background: var(--ink); color: #fff;
    font-family: var(--ui); font-size: 14px; font-weight: 500; letter-spacing: -.006em;
    cursor: pointer;
  }
  #apply:hover:not(:disabled) { background: var(--ink-hover); }
  #apply:disabled { opacity: .55; cursor: default; }

  .menu {
    position: fixed; z-index: 10;
    display: none; flex-direction: column;
    width: 340px; max-height: 420px; overflow-y: auto;
    padding: 6px; border-radius: 16px; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 18px 44px rgba(0,0,0,.14);
    font-family: var(--ui);
  }
  .menu[data-open="true"] { display: flex; }
  .menu::-webkit-scrollbar { width: 10px; }
  .menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3.5px solid #fff; }
  .group {
    padding: 14px 12px 6px; font-size: 10px; font-weight: 600;
    color: var(--label); letter-spacing: .11em; text-transform: uppercase;
  }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; border: 0; border-radius: 10px; background: transparent;
    cursor: pointer; text-align: left; color: var(--ink);
  }
  .row:hover, .row[data-active="true"] { background: var(--fill); }
  .row .check { display: flex; align-items: center; justify-content: center; width: 16px; flex-shrink: 0; }
  .row .name { flex-grow: 1; font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 24px; }
  .row[data-stroke="SERIF"] .name { font-size: 18px; letter-spacing: -.005em; }
  .row[data-class="mono"] .name { font-size: 15px; letter-spacing: -.01em; }

  #tip {
    position: fixed; z-index: 20; display: none; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius);
    background: var(--ink); color: #FAFAFA;
    font-family: var(--ui); font-size: 12px; font-weight: 500; line-height: 16px;
    letter-spacing: -.002em; pointer-events: none; white-space: nowrap;
  }
  #tip[data-open="true"] { display: flex; }
  #tip::after {
    content: ''; position: absolute; bottom: -4px; left: 50%; margin-left: -4px;
    width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg);
    border-radius: 1px;
  }
  #tip .kbd {
    display: flex; align-items: center; justify-content: center;
    height: 18px; min-width: 18px; padding: 0 5px; flex-shrink: 0;
    border-radius: 4px; background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.18);
    font-family: var(--mono); font-size: 10.5px; color: rgba(255,255,255,.72);
  }
</style>
</head>
<body>
<iframe id="app" src="/" title="Your app"></iframe>

<div id="dock">
  <div id="bar">
    <div class="history">
      <button class="icon-btn" id="undo" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="icon-btn" id="redo" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="rule"></div>
    <div class="selects" id="selects"></div>
    <div class="rule"></div>
    <button id="apply">Apply to code</button>
    <button class="icon-btn" id="done">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
</div>

<div id="tip"></div>

<script type="module">
const PREFIX = '/__fonts'
const ROLES = [
  { id: 'header', label: 'Header', key: 'h' },
  { id: 'text',   label: 'Text',   key: 't' },
  { id: 'mono',   label: 'Mono',   key: 'm' },
]
const FALLBACK = {
  SANS_SERIF: 'system-ui, "Helvetica Neue", sans-serif',
  SERIF: 'Charter, "Bitstream Charter", Georgia, serif',
}
const MONO_FALLBACK = 'ui-monospace, "SF Mono", monospace'
const GROUPS = ['Sans', 'Serif', 'Mono']

const data = await fetch(`${PREFIX}/fonts.json`).then((r) => r.json())
const session = await fetch(`${PREFIX}/session`).then((r) => r.json()).catch(() => ({ watched: false }))
const byName = new Map(data.fonts.map((f) => [f.name, f]))

const groupOf = (f) => (f.class === 'mono' ? 'Mono' : f.stroke === 'SERIF' ? 'Serif' : 'Sans')

// Grouped by stroke, alphabetical inside each group.
const listFor = (role) =>
  data.fonts
    .filter((f) => f.roles.includes(role))
    .sort(
      (a, b) =>
        GROUPS.indexOf(groupOf(a)) - GROUPS.indexOf(groupOf(b)) || a.name.localeCompare(b.name),
    )

// --- font loading -----------------------------------------------------------

// Google rejects weights a family doesn't ship, so ranges come from the data.
const weightParam = (f, full) => {
  if (f.wght) return full ? `:wght@${f.wght[0]}..${f.wght[1]}` : ':wght@400;500'
  if (f.weights?.length) return `:wght@${f.weights.join(';')}`
  return ''
}
const cssUrl = (fonts, full) =>
  'https://fonts.googleapis.com/css2?' +
  fonts.map((f) => `family=${f.name.replace(/ /g, '+')}${weightParam(f, full)}`).join('&') +
  '&display=swap'

// Keyed per document, not per frame: a navigation or full HMR reload replaces
// the framed document, and a flat cache would skip re-injecting the font link
// into the new one — leaving the page silently on system fonts.
const loadedByDoc = new WeakMap()
function loadInto(doc, font) {
  let seen = loadedByDoc.get(doc)
  if (!seen) loadedByDoc.set(doc, (seen = new Set()))
  if (seen.has(font.name)) return
  seen.add(font.name)
  const link = doc.createElement('link')
  link.rel = 'stylesheet'
  link.href = cssUrl([font], true)
  doc.head.appendChild(link)
}

document.head.insertAdjacentHTML(
  'beforeend',
  `<link rel="stylesheet" href="${cssUrl(data.fonts, false)}">`,
)

// --- state ------------------------------------------------------------------

const pick = (role, want) => {
  const list = listFor(role)
  return (list.find((f) => f.name === want) ?? list[0]).name
}
let selection = { header: pick('header', 'Geist'), text: pick('text', 'Geist'), mono: pick('mono', 'Geist Mono') }
const past = []
const future = []

function commit(next) {
  past.push({ ...selection })
  future.length = 0
  selection = next
  render()
}

// --- preview ----------------------------------------------------------------

const frame = document.getElementById('app')

// The fallback follows the font, not the slot — a mono falling back to a
// proportional face reflows the whole page when the webfont lands.
function stack(name) {
  const f = byName.get(name)
  return `"${name}", ${f.class === 'mono' ? MONO_FALLBACK : FALLBACK[f.stroke]}`
}

function applyPreview() {
  const doc = frame.contentDocument
  if (!doc?.head) return

  for (const role of ['header', 'text', 'mono']) loadInto(doc, byName.get(selection[role]))
  const leading = byName.get(selection.text).stroke === 'SERIF' ? 1.7 : 1.5

  let style = doc.getElementById('__fonts-preview')
  if (!style) {
    style = doc.createElement('style')
    style.id = '__fonts-preview'
    doc.head.appendChild(style)
  }
  style.textContent = `
    html { -webkit-text-size-adjust: 100%; }
    body, p, li, td, th, input, textarea, select, button, blockquote, figcaption,
    label, span, div, a { font-family: ${stack(selection.text)} !important; }
    h1, h2, h3, h4, h5, h6 { font-family: ${stack(selection.header)} !important; }
    code, pre, kbd, samp, tt { font-family: ${stack(selection.mono)} !important; }
    p, li { line-height: ${leading}; }
  `
}

frame.addEventListener('load', applyPreview)

// --- tooltips ---------------------------------------------------------------

const tipEl = document.getElementById('tip')
let tipTimer = null

function attachTip(el, text, keys) {
  const show = () => {
    tipEl.innerHTML = `<span>${text}</span>` + (keys ? `<span class="kbd">${keys}</span>` : '')
    tipEl.dataset.open = 'true'
    const r = el.getBoundingClientRect()
    const t = tipEl.getBoundingClientRect()
    tipEl.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 8))}px`
    tipEl.style.top = `${r.top - t.height - 8}px`
  }
  const hide = () => {
    clearTimeout(tipTimer)
    tipEl.dataset.open = 'false'
  }
  el.addEventListener('mouseenter', () => {
    clearTimeout(tipTimer)
    tipTimer = setTimeout(show, 400)
  })
  el.addEventListener('mouseleave', hide)
  el.addEventListener('click', hide)
  el.__hideTip = hide
}

// --- rendering --------------------------------------------------------------

const CARET = `<svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`
const CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`

const selectsEl = document.getElementById('selects')
const menus = new Map()

for (const role of ROLES) {
  const btn = document.createElement('button')
  btn.className = 'select'
  btn.dataset.role = role.id
  btn.setAttribute('aria-expanded', 'false')
  btn.innerHTML = `<span class="col"><span class="label">${role.label}</span><span class="value"></span></span>${CARET}`
  btn.addEventListener('click', (e) => {
    e.stopPropagation()
    toggle(role.id)
  })
  attachTip(btn, `Change ${role.label.toLowerCase()} font`, role.key.toUpperCase())
  selectsEl.appendChild(btn)

  const menu = document.createElement('div')
  menu.className = 'menu'
  menu.dataset.open = 'false'
  document.body.appendChild(menu)
  menus.set(role.id, { btn, menu })

  let lastGroup = null
  for (const f of listFor(role.id)) {
    const g = groupOf(f)
    if (g !== lastGroup) {
      lastGroup = g
      const h = document.createElement('div')
      h.className = 'group'
      h.textContent = g
      menu.appendChild(h)
    }
    const row = document.createElement('button')
    row.className = 'row'
    row.dataset.name = f.name
    row.dataset.stroke = f.stroke
    row.dataset.class = f.class
    row.innerHTML = `<span class="check"></span><span class="name">${f.name}</span>`
    row.querySelector('.name').style.fontFamily = stack(f.name)
    row.addEventListener('click', () => {
      commit({ ...selection, [role.id]: f.name })
      close()
    })
    menu.appendChild(row)
  }
}

function render() {
  for (const role of ROLES) {
    const { btn, menu } = menus.get(role.id)
    const name = selection[role.id]
    const value = btn.querySelector('.value')
    value.textContent = name
    value.style.fontFamily = stack(name)
    for (const row of menu.querySelectorAll('.row')) {
      const on = row.dataset.name === name
      row.querySelector('.check').innerHTML = on ? CHECK : ''
      row.dataset.active = String(on)
    }
  }
  undoBtn.disabled = past.length === 0
  redoBtn.disabled = future.length === 0
  resetApply()
  applyPreview()
}

// --- menus ------------------------------------------------------------------

let open = null

function close() {
  if (!open) return
  const { btn, menu } = menus.get(open)
  menu.dataset.open = 'false'
  btn.setAttribute('aria-expanded', 'false')
  open = null
}

function toggle(roleId) {
  const wasOpen = open === roleId
  close()
  if (wasOpen) return
  const { btn, menu } = menus.get(roleId)
  menus.get(roleId).btn.__hideTip?.()
  menu.dataset.open = 'true'
  btn.setAttribute('aria-expanded', 'true')
  const r = btn.getBoundingClientRect()
  menu.style.left = `${Math.max(12, Math.min(r.left, innerWidth - 352))}px`
  menu.style.bottom = `${innerHeight - r.top + 8}px`
  open = roleId
  menu.querySelector('.row[data-active="true"]')?.scrollIntoView({ block: 'center' })
}

document.addEventListener('click', close)
document.getElementById('bar').addEventListener('click', (e) => e.stopPropagation())
for (const { menu } of menus.values()) menu.addEventListener('click', (e) => e.stopPropagation())

// --- history ----------------------------------------------------------------

const undoBtn = document.getElementById('undo')
const redoBtn = document.getElementById('redo')

function undo() {
  if (!past.length) return
  future.push({ ...selection })
  selection = past.pop()
  render()
}
function redo() {
  if (!future.length) return
  past.push({ ...selection })
  selection = future.pop()
  render()
}
undoBtn.addEventListener('click', undo)
redoBtn.addEventListener('click', redo)
attachTip(undoBtn, 'Undo', '⌘Z')
attachTip(redoBtn, 'Redo', '⇧⌘Z')

// --- apply / done -----------------------------------------------------------

const applyBtn = document.getElementById('apply')
const doneBtn = document.getElementById('done')
const APPLY_LABEL = session.watched ? 'Apply to code' : 'Save selection'

// Changing anything after an apply puts the button back in its ready state —
// applying is a step in the loop now, not the end of it.
function resetApply() {
  applyBtn.textContent = APPLY_LABEL
  applyBtn.disabled = false
}

attachTip(
  applyBtn,
  session.watched ? 'Update fonts across your project' : 'Save to .fonts-selection.json',
  '⌘↵',
)
attachTip(doneBtn, 'Close the picker')

applyBtn.addEventListener('click', async () => {
  applyBtn.disabled = true
  applyBtn.textContent = 'Applying…'
  const payload = {}
  for (const role of ROLES) {
    const f = byName.get(selection[role.id])
    payload[role.id] = {
      name: f.name,
      stroke: f.stroke,
      class: f.class,
      variable: f.axes.length > 0,
      wght: f.wght,
      weights: f.weights,
      css: cssUrl([f], true),
      stack: stack(f.name),
    }
  }
  payload.lineHeight = { text: byName.get(selection.text).stroke === 'SERIF' ? 1.7 : 1.5 }
  try {
    await fetch(`${PREFIX}/apply`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    })
    applyBtn.textContent = 'Applied'
  } catch {
    applyBtn.textContent = 'Failed'
    applyBtn.disabled = false
  }
})

doneBtn.addEventListener('click', async () => {
  doneBtn.disabled = true
  await fetch(`${PREFIX}/done`, { method: 'POST' }).catch(() => {})
  document.body.innerHTML =
    `<div style="display:flex;height:100%;align-items:center;justify-content:center;` +
    `font-family:var(--ui);font-size:14px;color:#737373">Picker closed. You can close this tab.</div>`
})

// --- keyboard ---------------------------------------------------------------

// Bare keys are safe: the shell has no text input. Adding search changes that.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) {
    const k = e.key.toLowerCase()
    if (k === 'z') {
      e.preventDefault()
      e.shiftKey ? redo() : undo()
    }
    if (k === 'enter') applyBtn.click()
    return
  }
  if (e.key === 'Escape') return close()
  const role = ROLES.find((r) => r.key === e.key.toLowerCase())
  if (role) {
    e.preventDefault()
    toggle(role.id)
  }
})

render()
</script>
</body>
</html>
